name: Deploy to GitHub Pages

# يعمل يدويًا فقط حتى تُفعَّل الفوترة على حساب GitHub.
# بعدها: أضف `push: { branches: [main] }` هنا، وغيّر مصدر Pages إلى GitHub Actions.
on:
  workflow_dispatch:

# صلاحيات النشر على Pages فقط — لا كتابة على الكود
permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل وقت، والدفعات الجديدة تُلغي القديمة قيد التنفيذ
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # المسار الفرعي الذي يُنشر عليه التطبيق على Pages
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
